<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Othello</title>
  <style>
    :root {
      --felt: #1f6b45;
      --felt-dark: #154d31;
      --wood: #3b2a1e;
      --ink: #f4efe6;
      --muted: #b9b1a3;
      --accent: #e8b04a;
      font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #4a3527, var(--wood) 60%);
      color: var(--ink);
    }
    main { width: min(94vw, 560px, 100vh - 160px); min-width: 300px; padding: 24px 0; }
    h1 { margin: 0 0 16px; font-size: 2rem; letter-spacing: 0.04em; text-align: center; }

    .players { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .player {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 12px;
      background: rgb(0 0 0 / 0.25); border: 2px solid transparent;
    }
    .player.active { border-color: var(--accent); }
    .player .count { font-size: 1.6rem; font-weight: 700; margin-left: auto; }
    .player .who { font-size: 0.85rem; color: var(--muted); }
    .chip { width: 28px; height: 28px; border-radius: 50%; flex: none; }
    .chip.black { background: #111; box-shadow: inset 0 -3px 0 #000, inset 0 2px 2px #444; }
    .chip.white { background: #f6f3ec; box-shadow: inset 0 -3px 0 #cfc8ba; }

    button {
      font: inherit; font-size: 0.85rem; cursor: pointer;
      border: none; border-radius: 8px; padding: 4px 10px;
      background: var(--accent); color: #2a1d10; font-weight: 600;
    }
    button.secondary { background: rgb(255 255 255 / 0.15); color: var(--ink); }

    #status { min-height: 1.5em; margin: 0 0 12px; text-align: center; font-size: 1.05rem; }

    #board {
      display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px;
      padding: 10px; border-radius: 14px;
      background: var(--felt-dark);
      box-shadow: 0 12px 30px rgb(0 0 0 / 0.45), inset 0 0 0 3px #0d3420;
      aspect-ratio: 1;
    }
    .cell {
      background: var(--felt); border-radius: 4px;
      display: grid; place-items: center; border: none; padding: 0;
    }
    .cell:disabled { cursor: default; }
    .cell.legal::after {
      content: ""; width: 26%; height: 26%; border-radius: 50%;
      background: rgb(0 0 0 / 0.25);
    }
    .cell.legal:hover::after { background: rgb(232 176 74 / 0.7); }
    .cell .chip { width: 82%; height: 82%; }
    .cell.last .chip { outline: 3px solid var(--accent); outline-offset: 1px; }

    footer { margin-top: 14px; display: flex; justify-content: center; }
  </style>
</head>
<body>
  <main>
    <h1>Othello</h1>
    <div class="players">
      <div class="player" id="black"></div>
      <div class="player" id="white"></div>
    </div>
    <p id="status">Connecting…</p>
    <div id="board"></div>
    <footer><button class="secondary" id="reset" hidden>New game</button></footer>
  </main>
  <script type="module" src="/client.js"></script>
</body>
</html>
